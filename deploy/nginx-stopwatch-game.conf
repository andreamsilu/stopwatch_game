# Gandisha Ushinde web app and same-origin API reverse proxy.
# Install in /etc/nginx/sites-available and enable it from sites-enabled.
server {
    listen 8089;
    server_name _;

    root /var/www/stopwatch_game_live;
    index index.html;

    location /api/ {
        proxy_pass http://10.4.9.74:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
